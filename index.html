<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Space Launch Dash</title>
  </head>
  <body>
    <div class="container">
      <h1>Space Launch Dash</h1>

      <div class="section">
        <div class="lane">
          <button id="apollo-btn" value="Apollo">Boost!</button>
          <div class="track"><img id="apollo-rocket" src="https://www.shutterstock.com/image-illustration/saturn-v-rocket-isolated-3d-600nw-1584824887.jpg" alt="Apollo rocket" /></div>
        </div>

        <div class="lane">
          <button id="nebula-btn" value="Nebula">Boost!</button>
          <div class="track"><img id="nebula-rocket" src="https://img.freepik.com/free-psd/space-rocket-studio_23-2151841080.jpg?semt=ais_hybrid&w=740&q=80" alt="Nebula rocket" /></div>
        </div>

        <div class="lane">
          <button id="comet-btn" value="Comet">Boost!</button>
          <div class="track"><img id="comet-rocket" src="https://www.spacevoyaging.com/wp-content/uploads/brizy/imgs/Full3-478x850x74x0x368x850x1682212049.png" alt="Comet rocket" /></div>
        </div>
      </div>

      <div id="winner"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
